services:
  - type: web
    name: dreamspire-orchestrator
    env: docker
    region: frankfurt
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "4000"
      - key: SHOPIFY_SHOP_URL
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAPSTITCH_API_KEY
        sync: false
      - key: PRINTFUL_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
